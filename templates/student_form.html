{% extends "base.html" %}
{% block title %}{{ 'Edit' if student else 'Add' }} student | Student Manager{% endblock %}
{% block content %}
<section class="form-card">
    <p class="eyebrow">STUDENT RECORD</p>
    <h1>{{ 'Edit student' if student else 'Add a student' }}</h1>
    <p class="muted">Enter the student's details below.</p>

    <form method="POST" class="student-form">
        <label for="name">Full name</label>
        <input id="name" name="name" required maxlength="100"
               value="{{ student['name'] if student else '' }}" placeholder="e.g. Asha Kumar">

        <label for="email">Email address</label>
        <input id="email" name="email" type="email" required maxlength="150"
               value="{{ student['email'] if student else '' }}" placeholder="asha@example.com">

        <label for="course">Course</label>
        <input id="course" name="course" required maxlength="100"
               value="{{ student['course'] if student else '' }}" placeholder="e.g. Computer Science">

        <label for="marks">Marks (0–100)</label>
        <input id="marks" name="marks" type="number" min="0" max="100" step="1" required
               value="{{ student['marks'] if student else '' }}" placeholder="e.g. 85">

        <div class="form-actions">
            <button class="button" type="submit">{{ 'Save changes' if student else 'Add student' }}</button>
            <a class="button secondary" href="{{ url_for('index') }}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
